<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" id="metaThemeColor" content="#0f766e" />
  <link rel="manifest" href="manifest.json" />
  <title>Rekap Pengiriman Barang</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --surface-alt: #f8fafc;
      --input-bg: #ffffff;
      --primary: #0f766e;
      --primary-hover: #115e59;
      --chip-bg: #ccfbf1;
      --chip-text: #115e59;
      --sync-bg: #e0f2fe;
      --sync-text: #0369a1;
      --excel: #15803d;
      --pdf: #dc2626;
      --warn-bg: #fef3c7;
      --warn-text: #b45309;
      --danger-bg: #fee2e2;
      --danger: #b91c1c;
      --cancel-bg: #e2e8f0;
      --cancel-text: #334155;
      --border: #e2e8f0;
      --input-border: #cbd5e1;
      --label-text: #334155;
      --text: #0f172a;
      --muted: #64748b;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }

    :root[data-theme="dark"] {
      --bg: #0b1120;
      --card: #111827;
      --surface-alt: #1e293b;
      --input-bg: #0f172a;
      --primary: #14b8a6;
      --primary-hover: #0d9488;
      --chip-bg: rgba(20, 184, 166, 0.18);
      --chip-text: #5eead4;
      --sync-bg: rgba(14, 165, 233, 0.16);
      --sync-text: #38bdf8;
      --excel: #16a34a;
      --pdf: #ef4444;
      --warn-bg: rgba(245, 158, 11, 0.16);
      --warn-text: #fbbf24;
      --danger-bg: rgba(239, 68, 68, 0.16);
      --danger: #f87171;
      --cancel-bg: #334155;
      --cancel-text: #e2e8f0;
      --border: #1f2937;
      --input-border: #334155;
      --label-text: #cbd5e1;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .header-left {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.45rem;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .theme-toggle {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      font-size: 1.05rem;
      flex-shrink: 0;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 12px;
      align-items: end;
    }

    .form-group {
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--label-text);
      margin-bottom: 5px;
    }

    .form-group input {
      width: 100%;
      padding: 9px 11px;
      background: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .selected-toko-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px;
    }

    .selected-toko-list:empty {
      display: none;
    }

    .toko-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--chip-bg);
      color: var(--chip-text);
      font-size: 0.78rem;
      font-weight: 600;
    }

    .toko-chip button {
      background: transparent;
      color: inherit;
      padding: 0;
      font-size: 0.85rem;
      line-height: 1;
      border-radius: 999px;
      width: 15px;
      height: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .autocomplete-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      max-height: 220px;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
      z-index: 40;
      display: none;
    }

    .autocomplete-list.open {
      display: block;
    }

    .autocomplete-item {
      padding: 8px 11px;
      font-size: 0.88rem;
      cursor: pointer;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .autocomplete-item:last-child {
      border-bottom: none;
    }

    .autocomplete-item:hover,
    .autocomplete-item.active {
      background: var(--surface-alt);
      color: var(--primary);
      font-weight: 600;
    }

    .autocomplete-item.picked {
      background: var(--surface-alt);
      color: var(--primary);
      font-weight: 600;
    }

    .autocomplete-empty {
      padding: 8px 11px;
      font-size: 0.84rem;
      color: var(--muted);
    }

    #jumlahKoli::-webkit-outer-spin-button,
    #jumlahKoli::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    #jumlahKoli[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
    }

    :root[data-theme="dark"] input[type="date"] {
      color-scheme: dark;
    }

    .form-actions {
      display: flex;
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
    }

    button:hover:not(:disabled) {
      opacity: 0.92;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      flex: 1;
    }

    :root[data-theme="dark"] .btn-primary {
      color: #062824;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-cancel {
      background: var(--cancel-bg);
      color: var(--cancel-text);
    }

    .btn-sync {
      background: var(--sync-bg);
      color: var(--sync-text);
    }

    .btn-excel {
      background: var(--excel);
      color: #ffffff;
    }

    .btn-pdf {
      background: var(--pdf);
      color: #ffffff;
    }

    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .btn-edit {
      background: var(--warn-bg);
      color: var(--warn-text);
      padding: 5px 9px;
      font-size: 0.78rem;
      margin-right: 4px;
    }

    .btn-del {
      background: var(--danger-bg);
      color: var(--danger);
      padding: 5px 9px;
      font-size: 0.78rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .search-box {
      min-width: 240px;
      flex: 1;
      max-width: 360px;
      padding: 8px 11px;
      background: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      font-size: 0.88rem;
    }

    .search-box:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.89rem;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: var(--surface-alt);
      font-weight: 700;
      color: var(--label-text);
    }

    tfoot td {
      background: var(--surface-alt);
      font-weight: 700;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 12px;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.86rem;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .status-badge {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--surface-alt);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .status-badge.ok {
      color: var(--primary);
    }

    .status-badge.err {
      color: var(--danger);
      background: var(--danger-bg);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <h1>Rekap Pengiriman Barang</h1>
        <p class="subtitle">Terhubung ke Google Sheets • Akses multi-perangkat</p>
      </div>
      <button
        type="button"
        class="theme-toggle"
        id="themeToggleBtn"
        aria-label="Ganti tema terang atau gelap"
        title="Ganti tema terang / gelap"
      >🌙</button>
    </div>

    <div class="card">
      <form id="pengirimanForm" class="form-grid" autocomplete="off">
        <input type="hidden" id="editIndex" value="" />
        <input type="hidden" id="editId" value="" />

        <div class="form-group">
          <label for="regionalInput">Regional</label>
          <input
            type="text"
            id="regionalInput"
            placeholder="Ketik / klik regional..."
            required
          />
          <div class="autocomplete-list" id="regionalSuggestions" role="listbox"></div>
        </div>

        <div class="form-group">
          <label for="namaToko">Nama Toko (Bisa Lebih dari 1)</label>
          <input
            type="text"
            id="namaToko"
            placeholder="Pilih regional dulu..."
          />
          <div class="selected-toko-list" id="selectedTokoChips"></div>
          <div class="autocomplete-list" id="tokoSuggestions" role="listbox"></div>
        </div>

        <div class="form-group">
          <label for="tanggalPengiriman">Tanggal Pengiriman</label>
          <input type="date" id="tanggalPengiriman" required />
        </div>

        <div class="form-group">
          <label for="noSuratJalan">No Surat Jalan</label>
          <input type="text" id="noSuratJalan" placeholder="Nomor surat jalan" required />
        </div>

        <div class="form-group">
          <label for="jumlahKoli">Jumlah Koli</label>
          <input type="number" id="jumlahKoli" min="1" step="1" placeholder="0" required />
        </div>

        <div class="form-group">
          <label for="noResi">No Resi</label>
          <input type="text" id="noResi" placeholder="Nomor resi" required />
        </div>

        <div class="form-group form-actions">
          <button type="submit" class="btn-primary" id="submitBtn">+ Simpan</button>
          <button type="button" class="btn-cancel" id="cancelEditBtn" style="display: none;">Batal</button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="meta-row">
        <div id="summaryBar">Menampilkan 0 dari 0 data • Total Koli: 0</div>
        <span class="status-badge" id="syncStatus">Menunggu sinkronisasi...</span>
      </div>

      <div class="toolbar">
        <input
          type="search"
          id="searchInput"
          class="search-box"
          placeholder="Cari regional, nama toko, no surat jalan, atau no resi..."
        />
        <div class="btn-group">
          <button type="button" class="btn-sync" id="refreshBtn">↻ Sinkron</button>
          <button type="button" class="btn-excel" id="exportExcelBtn">Export Excel (.xlsx)</button>
          <button type="button" class="btn-pdf" id="exportPdfBtn">Export PDF</button>
          <button type="button" class="btn-danger" id="clearAllBtn">Reset Semua</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>Regional</th>
              <th>Nama Toko</th>
              <th>Tanggal Pengiriman</th>
              <th>No Surat Jalan</th>
              <th>Jumlah Koli</th>
              <th>No Resi</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="8" class="empty">Belum ada data pengiriman.</td>
            </tr>
          </tbody>
          <tfoot id="tableFoot" style="display: none;">
            <tr>
              <td colspan="5" style="text-align: right;">Total Koli</td>
              <td id="totalKoliCell">0</td>
              <td colspan="2"></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzMGFCxAuwq7_E2JYeosMkboCxPgjjRB87J-pqsa6FV1ODRiHjF5-KdpdE1o9d5kF0WKw/exec";
    const STORAGE_KEY = "rekap_pengiriman_sheets_v2";
    const REGIONAL_CACHE_KEY = "ekspedisi_regional_list_v1";
    const TOKO_BY_REGIONAL_CACHE_KEY = "ekspedisi_toko_by_regional_v1";
    const THEME_KEY = "ekspedisi_tema_v1";

    let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    let regionalList = JSON.parse(localStorage.getItem(REGIONAL_CACHE_KEY) || "[]");
    let tokoByRegional = JSON.parse(localStorage.getItem(TOKO_BY_REGIONAL_CACHE_KEY) || "{}");
    let selectedTokoList = [];
    let isBusy = false;
    let activeRegionalIdx = -1;
    let activeTokoIdx = -1;

    const rootEl = document.documentElement;
    const themeToggleBtn = document.getElementById("themeToggleBtn");
    const metaThemeColor = document.getElementById("metaThemeColor");
    const form = document.getElementById("pengirimanForm");
    const regionalInput = document.getElementById("regionalInput");
    const regionalSuggestionsEl = document.getElementById("regionalSuggestions");
    const namaTokoInput = document.getElementById("namaToko");
    const selectedTokoChipsEl = document.getElementById("selectedTokoChips");
    const tokoSuggestionsEl = document.getElementById("tokoSuggestions");
    const jumlahKoliInput = document.getElementById("jumlahKoli");
    const editIndexInput = document.getElementById("editIndex");
    const editIdInput = document.getElementById("editId");
    const submitBtn = document.getElementById("submitBtn");
    const cancelEditBtn = document.getElementById("cancelEditBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const clearAllBtn = document.getElementById("clearAllBtn");
    const searchInput = document.getElementById("searchInput");
    const tableBody = document.getElementById("tableBody");
    const tableFoot = document.getElementById("tableFoot");
    const totalKoliCell = document.getElementById("totalKoliCell");
    const summaryBar = document.getElementById("summaryBar");
    const syncStatus = document.getElementById("syncStatus");

    jumlahKoliInput.addEventListener("wheel", function (e) {
      e.preventDefault();
    }, { passive: false });

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function getTokoForRegional(regionalName) {
      const key = String(regionalName || "").trim().toLowerCase();
      if (!key) return [];
      if (Array.isArray(tokoByRegional[key])) {
        return tokoByRegional[key];
      }
      const matchedKey = Object.keys(tokoByRegional).find(
        (k) => k.includes(key) || key.includes(k)
      );
      return matchedKey && Array.isArray(tokoByRegional[matchedKey])
        ? tokoByRegional[matchedKey]
        : [];
    }

    function updateTokoPlaceholder() {
      const hasReg = String(regionalInput.value || "").trim().length > 0;
      if (!hasReg) {
        namaTokoInput.placeholder = "Pilih regional dulu...";
      } else if (selectedTokoList.length > 0) {
        namaTokoInput.placeholder = "Tambah toko lain di regional ini...";
      } else {
        namaTokoInput.placeholder = "Klik / ketik pilih toko...";
      }
    }

    function renderSelectedTokoChips() {
      selectedTokoChipsEl.innerHTML = selectedTokoList
        .map((nama, idx) => `
          <span class="toko-chip">
            <span>${escapeHtml(nama)}</span>
            <button type="button" title="Hapus toko" aria-label="Hapus ${escapeHtml(nama)}" data-idx="${idx}">×</button>
          </span>
        `)
        .join("");

      selectedTokoChipsEl.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", function () {
          const idx = Number(btn.getAttribute("data-idx"));
          selectedTokoList.splice(idx, 1);
          renderSelectedTokoChips();
          updateTokoPlaceholder();
          if (tokoSuggestionsEl.classList.contains("open")) {
            renderTokoSuggestions();
          }
        });
      });
    }

    function toggleTokoSelection(nama) {
      const clean = String(nama || "").trim();
      if (!clean) return;
      const existingIdx = selectedTokoList.findIndex(
        (t) => t.toLowerCase() === clean.toLowerCase()
      );
      if (existingIdx >= 0) {
        selectedTokoList.splice(existingIdx, 1);
      } else {
        selectedTokoList.push(clean);
      }
      namaTokoInput.value = "";
      renderSelectedTokoChips();
      updateTokoPlaceholder();
      renderTokoSuggestions();
      namaTokoInput.focus();
    }

    function addManualTokoFromInput() {
      const raw = namaTokoInput.value.trim();
      if (!raw) return;
      const parts = raw.split(",").map((s) => s.trim()).filter(Boolean);
      parts.forEach((p) => {
        if (!selectedTokoList.some((t) => t.toLowerCase() === p.toLowerCase())) {
          selectedTokoList.push(p);
        }
      });
      namaTokoInput.value = "";
      renderSelectedTokoChips();
      updateTokoPlaceholder();
      renderTokoSuggestions();
    }

    function getFinalTokoString() {
      addManualTokoFromInput();
      return selectedTokoList.join(", ");
    }

    function closeRegionalSuggestions() {
      activeRegionalIdx = -1;
      regionalSuggestionsEl.classList.remove("open");
      regionalSuggestionsEl.innerHTML = "";
    }

    function closeTokoSuggestions() {
      activeTokoIdx = -1;
      tokoSuggestionsEl.classList.remove("open");
      tokoSuggestionsEl.innerHTML = "";
    }

    function selectRegional(nama) {
      const prevKey = regionalInput.value.trim().toLowerCase();
      const nextKey = String(nama || "").trim().toLowerCase();
      regionalInput.value = nama;
      if (prevKey !== nextKey) {
        selectedTokoList = [];
        namaTokoInput.value = "";
        renderSelectedTokoChips();
      }
      updateTokoPlaceholder();
      closeRegionalSuggestions();
      namaTokoInput.focus();
      renderTokoSuggestions();
    }

    function getMatchingRegional(query) {
      const q = String(query || "").trim().toLowerCase();
      if (!q) return regionalList.slice(0, 30);
      return regionalList.filter((nama) => nama.toLowerCase().includes(q)).slice(0, 30);
    }

    function renderRegionalSuggestions() {
      const matches = getMatchingRegional(regionalInput.value);
      activeRegionalIdx = -1;

      if (regionalList.length === 0) {
        regionalSuggestionsEl.innerHTML = `<div class="autocomplete-empty">Belum ada regional di sheet "daftar toko" kolom A. Ketik manual tetap bisa.</div>`;
        regionalSuggestionsEl.classList.add("open");
        return;
      }

      if (matches.length === 0) {
        regionalSuggestionsEl.innerHTML = `<div class="autocomplete-empty">Regional tidak ditemukan. Tetap bisa pakai ketikan manual.</div>`;
        regionalSuggestionsEl.classList.add("open");
        return;
      }

      regionalSuggestionsEl.innerHTML = matches
        .map((nama, idx) => `<div class="autocomplete-item" role="option" data-idx="${idx}" data-value="${escapeHtml(nama)}">${escapeHtml(nama)}</div>`)
        .join("");

      regionalSuggestionsEl.querySelectorAll(".autocomplete-item").forEach((el) => {
        el.addEventListener("mousedown", function (e) {
          e.preventDefault();
          selectRegional(el.getAttribute("data-value") || "");
        });
      });

      regionalSuggestionsEl.classList.add("open");
    }

    function getMatchingToko(query) {
      const regToko = getTokoForRegional(regionalInput.value);
      const q = String(query || "").trim().toLowerCase();
      if (!q) return regToko.slice(0, 40);
      return regToko.filter((nama) => nama.toLowerCase().includes(q)).slice(0, 40);
    }

    function renderTokoSuggestions() {
      const regVal = String(regionalInput.value || "").trim();
      activeTokoIdx = -1;

      if (!regVal) {
        tokoSuggestionsEl.innerHTML = `<div class="autocomplete-empty">Pilih atau ketik Regional terlebih dahulu.</div>`;
        tokoSuggestionsEl.classList.add("open");
        return;
      }

      const regToko = getTokoForRegional(regVal);
      if (regToko.length === 0) {
        tokoSuggestionsEl.innerHTML = `<div class="autocomplete-empty">Belum ada toko terdaftar di "${escapeHtml(regVal)}". Ketik nama toko lalu tekan Enter.</div>`;
        tokoSuggestionsEl.classList.add("open");
        return;
      }

      const matches = getMatchingToko(namaTokoInput.value);
      if (matches.length === 0) {
        tokoSuggestionsEl.innerHTML = `<div class="autocomplete-empty">Tidak cocok di daftar. Tekan Enter untuk menambahkan sebagai toko manual.</div>`;
        tokoSuggestionsEl.classList.add("open");
        return;
      }

      tokoSuggestionsEl.innerHTML = matches
        .map((nama, idx) => {
          const isPicked = selectedTokoList.some((t) => t.toLowerCase() === nama.toLowerCase());
          return `
            <div class="autocomplete-item ${isPicked ? "picked" : ""}" role="option" data-idx="${idx}" data-value="${escapeHtml(nama)}">
              <span>${escapeHtml(nama)}</span>
              <span>${isPicked ? "✓" : "+"}</span>
            </div>
          `;
        })
        .join("");

      tokoSuggestionsEl.querySelectorAll(".autocomplete-item").forEach((el) => {
        el.addEventListener("mousedown", function (e) {
          e.preventDefault();
          toggleTokoSelection(el.getAttribute("data-value") || "");
        });
      });

      tokoSuggestionsEl.classList.add("open");
    }

    regionalInput.addEventListener("input", function () {
      updateTokoPlaceholder();
      renderRegionalSuggestions();
    });

    regionalInput.addEventListener("focus", function () {
      closeTokoSuggestions();
      renderRegionalSuggestions();
    });

    regionalInput.addEventListener("keydown", function (e) {
      if (!regionalSuggestionsEl.classList.contains("open")) return;
      const items = regionalSuggestionsEl.querySelectorAll(".autocomplete-item");
      if (!items.length) return;

      if (e.key === "ArrowDown") {
        e.preventDefault();
        activeRegionalIdx = (activeRegionalIdx + 1) % items.length;
        items.forEach((el, i) => el.classList.toggle("active", i === activeRegionalIdx));
        items[activeRegionalIdx].scrollIntoView({ block: "nearest" });
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        activeRegionalIdx = (activeRegionalIdx - 1 + items.length) % items.length;
        items.forEach((el, i) => el.classList.toggle("active", i === activeRegionalIdx));
        items[activeRegionalIdx].scrollIntoView({ block: "nearest" });
      } else if (e.key === "Enter" && activeRegionalIdx >= 0) {
        e.preventDefault();
        selectRegional(items[activeRegionalIdx].getAttribute("data-value") || "");
      } else if (e.key === "Escape") {
        closeRegionalSuggestions();
      }
    });

    namaTokoInput.addEventListener("input", function () {
      if (namaTokoInput.value.includes(",")) {
        addManualTokoFromInput();
        return;
      }
      renderTokoSuggestions();
    });

    namaTokoInput.addEventListener("focus", function () {
      closeRegionalSuggestions();
      renderTokoSuggestions();
    });

    namaTokoInput.addEventListener("click", function () {
      closeRegionalSuggestions();
      renderTokoSuggestions();
    });

    namaTokoInput.addEventListener("keydown", function (e) {
      const items = tokoSuggestionsEl.classList.contains("open")
        ? tokoSuggestionsEl.querySelectorAll(".autocomplete-item")
        : [];

      if (e.key === "ArrowDown" && items.length) {
        e.preventDefault();
        activeTokoIdx = (activeTokoIdx + 1) % items.length;
        items.forEach((el, i) => el.classList.toggle("active", i === activeTokoIdx));
        items[activeTokoIdx].scrollIntoView({ block: "nearest" });
      } else if (e.key === "ArrowUp" && items.length) {
        e.preventDefault();
        activeTokoIdx = (activeTokoIdx - 1 + items.length) % items.length;
        items.forEach((el, i) => el.classList.toggle("active", i === activeTokoIdx));
        items[activeTokoIdx].scrollIntoView({ block: "nearest" });
      } else if (e.key === "Enter") {
        if (activeTokoIdx >= 0 && items[activeTokoIdx]) {
          e.preventDefault();
          toggleTokoSelection(items[activeTokoIdx].getAttribute("data-value") || "");
        } else if (namaTokoInput.value.trim()) {
          e.preventDefault();
          addManualTokoFromInput();
        }
      } else if (e.key === "Escape") {
        closeTokoSuggestions();
      }
    });

    document.addEventListener("click", function (e) {
      if (!e.target.closest("#regionalInput") && !e.target.closest("#regionalSuggestions")) {
        closeRegionalSuggestions();
      }
      if (
        !e.target.closest("#namaToko") &&
        !e.target.closest("#tokoSuggestions") &&
        !e.target.closest("#selectedTokoChips")
      ) {
        closeTokoSuggestions();
      }
    });

    function setSyncStatus(text, type = "") {
      syncStatus.textContent = text;
      syncStatus.className = "status-badge" + (type ? " " + type : "");
    }

    function setBusy(state) {
      isBusy = state;
      submitBtn.disabled = state;
      refreshBtn.disabled = state;
      clearAllBtn.disabled = state;
      document.querySelectorAll(".btn-edit, .btn-del").forEach((btn) => {
        btn.disabled = state;
      });
    }

    function isConfigured() {
      return (
        typeof APPS_SCRIPT_URL === "string" &&
        APPS_SCRIPT_URL.startsWith("https://script.google.com/macros/s/") &&
        APPS_SCRIPT_URL.endsWith("/exec")
      );
    }

    function createId() {
      return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
    }

    function getPreferredTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved === "dark" || saved === "light") return saved;
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
    }

    function applyTheme(theme, save = false) {
      const isDark = theme === "dark";
      if (isDark) {
        rootEl.setAttribute("data-theme", "dark");
        themeToggleBtn.textContent = "☀️";
        themeToggleBtn.title = "Ganti ke mode terang";
        metaThemeColor.setAttribute("content", "#0b1120");
      } else {
        rootEl.removeAttribute("data-theme");
        themeToggleBtn.textContent = "🌙";
        themeToggleBtn.title = "Ganti ke mode gelap";
        metaThemeColor.setAttribute("content", "#0f766e");
      }
      if (save) {
        localStorage.setItem(THEME_KEY, theme);
      }
    }

    applyTheme(getPreferredTheme(), false);

    themeToggleBtn.addEventListener("click", function () {
      const currentIsDark = rootEl.getAttribute("data-theme") === "dark";
      applyTheme(currentIsDark ? "light" : "dark", true);
    });

    document.getElementById("tanggalPengiriman").valueAsDate = new Date();

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      localStorage.setItem(REGIONAL_CACHE_KEY, JSON.stringify(regionalList));
      localStorage.setItem(TOKO_BY_REGIONAL_CACHE_KEY, JSON.stringify(tokoByRegional));
    }

    function formatTanggal(iso) {
      if (!iso) return "-";
      const str = String(iso).trim();
      const isoMatch = /^(\d{4})-(\d{2})-(\d{2})/.exec(str);
      if (isoMatch) {
        return `${isoMatch[3]}/${isoMatch[2]}/${isoMatch[1]}`;
      }
      const parsed = new Date(str);
      if (!Number.isNaN(parsed.getTime())) {
        const d = String(parsed.getDate()).padStart(2, "0");
        const m = String(parsed.getMonth() + 1).padStart(2, "0");
        const y = parsed.getFullYear();
        return `${d}/${m}/${y}`;
      }
      return str;
    }

    function getFilteredRecords() {
      const q = searchInput.value.trim().toLowerCase();
      if (!q) {
        return records.map((item, idx) => ({ item, realIndex: idx }));
      }
      return records
        .map((item, idx) => ({ item, realIndex: idx }))
        .filter(({ item }) =>
          [item.regional, item.namaToko, item.noSuratJalan, item.noResi, item.tanggalPengiriman]
            .some((val) => String(val || "").toLowerCase().includes(q))
        );
    }

    function render() {
      const filtered = getFilteredRecords();

      if (filtered.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="8" class="empty">
              ${records.length === 0 ? "Belum ada data pengiriman." : "Data tidak cocok dengan pencarian."}
            </td>
          </tr>
        `;
        tableFoot.style.display = "none";
        summaryBar.textContent = `Menampilkan 0 dari ${records.length} data • Total Koli: 0`;
        setBusy(isBusy);
        return;
      }

      let totalKoli = 0;
      tableBody.innerHTML = filtered
        .map(({ item, realIndex }, i) => {
          const koli = Number(item.jumlahKoli) || 0;
          totalKoli += koli;
          return `
            <tr>
              <td>${i + 1}</td>
              <td>${escapeHtml(item.regional)}</td>
              <td>${escapeHtml(item.namaToko)}</td>
              <td>${formatTanggal(item.tanggalPengiriman)}</td>
              <td>${escapeHtml(item.noSuratJalan)}</td>
              <td>${koli}</td>
              <td>${escapeHtml(item.noResi)}</td>
              <td>
                <button type="button" class="btn-edit" onclick="mulaiEdit(${realIndex})">Edit</button>
                <button type="button" class="btn-del" onclick="hapusData(${realIndex})">Hapus</button>
              </td>
            </tr>
          `;
        })
        .join("");

      totalKoliCell.textContent = totalKoli;
      tableFoot.style.display = "";
      summaryBar.textContent = `Menampilkan ${filtered.length} dari ${records.length} data • Total Koli: ${totalKoli}`;
      setBusy(isBusy);
    }

    function resetFormMode() {
      editIndexInput.value = "";
      editIdInput.value = "";
      submitBtn.textContent = "+ Simpan";
      cancelEditBtn.style.display = "none";
      regionalInput.value = "";
      selectedTokoList = [];
      namaTokoInput.value = "";
      renderSelectedTokoChips();
      document.getElementById("noSuratJalan").value = "";
      jumlahKoliInput.value = "";
      document.getElementById("noResi").value = "";
      updateTokoPlaceholder();
      closeRegionalSuggestions();
      closeTokoSuggestions();
      regionalInput.focus();
    }

    async function muatDariSheets() {
      if (!isConfigured()) {
        setSyncStatus("URL harus berakhiran /exec", "err");
        return;
      }
      setBusy(true);
      setSyncStatus("Menyinkronkan...", "");
      try {
        const res = await fetch(`${APPS_SCRIPT_URL}?t=${Date.now()}`);
        const json = await res.json();
        if (!json.ok) {
          throw new Error(json.error || "Gagal memuat data dari Google Sheets");
        }
        records = (Array.isArray(json.data) ? json.data : []).map((row) => ({
          ...row,
          id: row.id || createId(),
          regional: row.regional || "",
          jumlahKoli: Number(row.jumlahKoli) || 0,
        }));
        if (Array.isArray(json.regionalList)) {
          regionalList = json.regionalList;
        }
        if (json.tokoByRegional && typeof json.tokoByRegional === "object") {
          tokoByRegional = json.tokoByRegional;
        }
        persist();
        render();
        setSyncStatus(`Tersinkron (${regionalList.length} regional)`, "ok");
      } catch (err) {
        console.error(err);
        setSyncStatus("Gagal sinkron (pakai cache lokal)", "err");
      } finally {
        setBusy(false);
      }
    }

    async function kirimKeSheets(payload) {
      if (!isConfigured()) {
        throw new Error("URL Web App harus berakhiran /exec.");
      }
      const res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
      });
      const json = await res.json();
      if (!json.ok) {
        throw new Error(json.error || "Gagal menyimpan ke Google Sheets");
      }
      return json;
    }

    window.mulaiEdit = function (index) {
      const item = records[index];
      if (!item) return;
      editIndexInput.value = String(index);
      editIdInput.value = item.id || "";
      regionalInput.value = item.regional || "";
      selectedTokoList = String(item.namaToko || "")
        .split(",")
        .map((s) => s.trim())
        .filter(Boolean);
      namaTokoInput.value = "";
      renderSelectedTokoChips();
      document.getElementById("tanggalPengiriman").value = item.tanggalPengiriman;
      document.getElementById("noSuratJalan").value = item.noSuratJalan;
      jumlahKoliInput.value = item.jumlahKoli;
      document.getElementById("noResi").value = item.noResi;
      submitBtn.textContent = "Update";
      cancelEditBtn.style.display = "";
      updateTokoPlaceholder();
      closeRegionalSuggestions();
      closeTokoSuggestions();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    window.hapusData = async function (index) {
      if (isBusy) return;
      const target = records[index];
      if (!target) return;

      setBusy(true);
      setSyncStatus("Menghapus data...", "");
      try {
        if (isConfigured() && target.id) {
          await kirimKeSheets({ action: "delete", id: target.id });
        }
        records.splice(index, 1);
        if (editIndexInput.value === String(index)) {
          resetFormMode();
        }
        persist();
        render();
        setSyncStatus("Tersinkron ke Google Sheets", "ok");
      } catch (err) {
        alert("Gagal menghapus di Google Sheets: " + err.message);
        setSyncStatus("Gagal sinkron", "err");
      } finally {
        setBusy(false);
      }
    };

    cancelEditBtn.addEventListener("click", resetFormMode);
    searchInput.addEventListener("input", render);
    refreshBtn.addEventListener("click", muatDariSheets);

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      if (isBusy) return;

      const finalToko = getFinalTokoString();
      if (!finalToko) {
        alert("Pilih atau isi minimal satu Nama Toko terlebih dahulu.");
        namaTokoInput.focus();
        return;
      }

      const editIdx = editIndexInput.value;
      const existingId = editIdInput.value || createId();

      const entry = {
        id: existingId,
        regional: regionalInput.value.trim(),
        namaToko: finalToko,
        tanggalPengiriman: document.getElementById("tanggalPengiriman").value,
        noSuratJalan: document.getElementById("noSuratJalan").value.trim(),
        jumlahKoli: parseInt(jumlahKoliInput.value, 10) || 0,
        noResi: document.getElementById("noResi").value.trim(),
      };

      setBusy(true);
      setSyncStatus("Menyimpan ke Sheets...", "");

      try {
        if (editIdx !== "") {
          await kirimKeSheets({ action: "update", item: entry });
          records[Number(editIdx)] = entry;
        } else {
          const resp = await kirimKeSheets({ action: "add", item: entry });
          if (resp && resp.id) entry.id = resp.id;
          records.push(entry);
        }

        persist();
        render();
        resetFormMode();
        setSyncStatus("Tersinkron ke Google Sheets", "ok");
      } catch (err) {
        alert("Gagal menyimpan ke Google Sheets: " + err.message);
        setSyncStatus("Gagal menyimpan", "err");
      } finally {
        setBusy(false);
      }
    });

    clearAllBtn.addEventListener("click", async function () {
      if (isBusy || records.length === 0) return;
      if (!confirm("Hapus semua data rekap pengiriman (termasuk di Google Sheets)?")) return;

      setBusy(true);
      setSyncStatus("Menghapus semua data...", "");
      try {
        if (isConfigured()) {
          await kirimKeSheets({ action: "clear" });
        }
        records = [];
        persist();
        resetFormMode();
        render();
        setSyncStatus("Tersinkron ke Google Sheets", "ok");
      } catch (err) {
        alert("Gagal mereset data di Google Sheets: " + err.message);
        setSyncStatus("Gagal sinkron", "err");
      } finally {
        setBusy(false);
      }
    });

    document.getElementById("exportExcelBtn").addEventListener("click", function () {
      const filtered = getFilteredRecords();
      if (filtered.length === 0) {
        alert("Tidak ada data untuk di-export.");
        return;
      }

      const headers = [
        "No",
        "Regional",
        "Nama Toko",
        "Tanggal Pengiriman",
        "No Surat Jalan",
        "Jumlah Koli",
        "No Resi",
      ];

      let totalKoli = 0;
      const dataRows = filtered.map(({ item }, idx) => {
        const koli = Number(item.jumlahKoli) || 0;
        totalKoli += koli;
        return [
          idx + 1,
          String(item.regional ?? ""),
          String(item.namaToko ?? ""),
          formatTanggal(item.tanggalPengiriman),
          String(item.noSuratJalan ?? ""),
          koli,
          String(item.noResi ?? ""),
        ];
      });

      const totalRow = ["", "", "", "", "Total Koli", totalKoli, ""];
      const aoa = [headers, ...dataRows, totalRow];
      const ws = XLSX.utils.aoa_to_sheet(aoa);

      const totalDataRows = dataRows.length;
      for (let r = 1; r <= totalDataRows; r++) {
        const sjCell = ws[XLSX.utils.encode_cell({ r, c: 4 })];
        if (sjCell) {
          sjCell.t = "s";
          sjCell.z = "@";
        }
        const resiCell = ws[XLSX.utils.encode_cell({ r, c: 6 })];
        if (resiCell) {
          resiCell.t = "s";
          resiCell.z = "@";
        }
      }

      ws["!cols"] = [
        { wch: 6 },
        { wch: 20 },
        { wch: 28 },
        { wch: 20 },
        { wch: 20 },
        { wch: 14 },
        { wch: 24 },
      ];

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Rekap Pengiriman");

      const today = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(wb, `rekap-pengiriman-${today}.xlsx`);
    });

    document.getElementById("exportPdfBtn").addEventListener("click", function () {
      const filtered = getFilteredRecords();
      if (filtered.length === 0) {
        alert("Tidak ada data untuk di-export.");
        return;
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
      const today = new Date().toISOString().slice(0, 10);

      doc.setFontSize(14);
      doc.setTextColor(15, 23, 42);
      doc.text("REKAP PENGIRIMAN BARANG", 14, 15);

      doc.setFontSize(9.5);
      doc.setTextColor(100, 116, 139);
      doc.text(`Tanggal Export: ${formatTanggal(today)} • Jumlah Baris: ${filtered.length}`, 14, 21);

      let totalKoli = 0;
      const body = filtered.map(({ item }, idx) => {
        const koli = Number(item.jumlahKoli) || 0;
        totalKoli += koli;
        return [
          String(idx + 1),
          String(item.regional ?? ""),
          String(item.namaToko ?? ""),
          formatTanggal(item.tanggalPengiriman),
          String(item.noSuratJalan ?? ""),
          String(koli),
          String(item.noResi ?? ""),
        ];
      });

      const totalRowIndex = body.length;
      body.push(["", "", "", "", "Total Koli", String(totalKoli), ""]);

      doc.autoTable({
        startY: 26,
        head: [["No", "Regional", "Nama Toko", "Tanggal Pengiriman", "No Surat Jalan", "Jumlah Koli", "No Resi"]],
        body,
        styles: {
          fontSize: 9,
          cellPadding: 3,
          textColor: [15, 23, 42],
        },
        headStyles: {
          fillColor: [15, 118, 110],
          textColor: [255, 255, 255],
          fontStyle: "bold",
        },
        columnStyles: {
          0: { halign: "center", cellWidth: 12 },
          1: { cellWidth: 34 },
          2: { cellWidth: "auto" },
          3: { halign: "center", cellWidth: 32 },
          4: { cellWidth: 38 },
          5: { halign: "right", cellWidth: 24 },
          6: { cellWidth: 46 },
        },
        didParseCell: function (data) {
          if (data.section === "body" && data.row.index === totalRowIndex) {
            data.cell.styles.fontStyle = "bold";
            data.cell.styles.fillColor = [241, 245, 249];
          }
        },
      });

      doc.save(`rekap-pengiriman-${today}.pdf`);
    });

    updateTokoPlaceholder();
    render();
    muatDariSheets();
  </script>
</body>
</html>
