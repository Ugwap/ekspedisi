<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" id="metaThemeColor" content="#0f766e" />
  <link rel="manifest" href="manifest.json" />
  <title>Rekap Pengiriman Barang</title>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --surface-alt: #f8fafc;
      --input-bg: #ffffff;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--surface-alt);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .status-badge.ok {
      color: var(--primary);
    }

    .status-badge.err {
      color: var(--danger);
      background: var(--danger-bg);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <h1>Rekap Pengiriman Barang</h1>
        <p class="subtitle">Terhubung ke Google Sheets • Akses multi-perangkat</p>
      </div>
      <button
        type="button"
        class="theme-toggle"
        id="themeToggleBtn"
        aria-label="Ganti tema terang atau gelap"
        title="Ganti tema terang / gelap"
      >🌙</button>
    </div>

    <div class="card">
      <form id="pengirimanForm" class="form-grid" autocomplete="off">
        <input type="hidden" id="editIndex" value="" />
        <input type="hidden" id="editId" value="" />
