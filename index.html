<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" id="metaThemeColor" content="#0f766e" />
  <link rel="manifest" href="manifest.json" />
  <title>Rekap Pengiriman Barang</title>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --surface-alt: #f8fafc;
      --input-bg: #ffffff;
      --primary: #0f766e;
      --primary-hover: #115e59;
      --sync-bg: #e0f2fe;
      --sync-text: #0369a1;
      --excel: #15803d;
      --pdf: #dc2626;
      --warn-bg: #fef3c7;
      --warn-text: #b45309;
      --danger-bg: #fee2e2;
      --danger: #b91c1c;
      --cancel-bg: #e2e8f0;
      --cancel-text: #334155;
      --border: #e2e8f0;
      --input-border: #cbd5e1;
      --label-text: #334155;
      --text: #0f172a;
      --muted: #64748b;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }

    :root[data-theme="dark"] {
      --bg: #0b1120;
      --card: #111827;
      --surface-alt: #1e293b;
      --input-bg: #0f172a;
      --primary: #14b8a6;
      --primary-hover: #0d9488;
      --sync-bg: rgba(14, 165, 233, 0.16);
      --sync-text: #38bdf8;
      --excel: #16a34a;
      --pdf: #ef4444;
      --warn-bg: rgba(245, 158, 11, 0.16);
      --warn-text: #fbbf24;
      --danger-bg: rgba(239, 68, 68, 0.16);
      --danger: #f87171;
      --cancel-bg: #334155;
      --cancel-text: #e2e8f0;
      --border: #1f2937;
      --input-border: #334155;
      --label-text: #cbd5e1;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .header-left {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.45rem;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .theme-toggle {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      font-size: 1.05rem;
      flex-shrink: 0;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
      gap: 12px;
      align-items: end;
    }

    .form-group {
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--label-text);
      margin-bottom: 5px;
    }

    .form-group input {
      width: 100%;
      padding: 9px 11px;
      background: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .autocomplete-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      max-height: 210px;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
      z-index: 40;
      display: none;
    }

    .autocomplete-list.open {
      display: block;
    }

    .autocomplete-item {
      padding: 8px 11px;
      font-size: 0.88rem;
      cursor: pointer;
      color: var(--text);
      border-bottom: 1px solid var(--border);
    }

    .autocomplete-item:last-child {
      border-bottom: none;
    }

    .autocomplete-item:hover,
    .autocomplete-item.active {
      background: var(--surface-alt);
      color: var(--primary);
      font-weight: 600;
    }

    .autocomplete-empty {
      padding: 8px 11px;
      font-size: 0.84rem;
      color: var(--muted);
    }

    #jumlahKoli::-webkit-outer-spin-button,
    #jumlahKoli::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    #jumlahKoli[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
    }

    :root[data-theme="dark"] input[type="date"] {
      color-scheme: dark;
    }

    .form-actions {
      display: flex;
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
    }

    button:hover:not(:disabled) {
      opacity: 0.92;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      flex: 1;
    }

    :root[data-theme="dark"] .btn-primary {
      color: #062824;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-cancel {
      background: var(--cancel-bg);
      color: var(--cancel-text);
    }

    .btn-sync {
      background: var(--sync-bg);
      color: var(--sync-text);
    }

    .btn-excel {
      background: var(--excel);
      color: #ffffff;
    }

    .btn-pdf {
      background: var(--pdf);
      color: #ffffff;
    }

    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .btn-edit {
      background: var(--warn-bg);
      color: var(--warn-text);
      padding: 5px 9px;
      font-size: 0.78rem;
      margin-right: 4px;
    }

    .btn-del {
      background: var(--danger-bg);
      color: var(--danger);
      padding: 5px 9px;
      font-size: 0.78rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .search-box {
      min-width: 240px;
      flex: 1;
      max-width: 340px;
      padding: 8px 11px;
      background: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      font-size: 0.88rem;
    }

    .search-box:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.89rem;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: var(--surface-alt);
      font-weight: 700;
      color: var(--label-text);
    }

    tfoot td {
      background: var(--surface-alt);
      font-weight: 700;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 12px;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.86rem;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .status-badge {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--surface-alt);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .status-badge.ok {
      color: var(--primary);
    }

    .status-badge.err {
      color: var(--danger);
      background: var(--danger-bg);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <h1>Rekap Pengiriman Barang</h1>
        <p class="subtitle">Terhubung ke Google Sheets • Akses multi-perangkat</p>
      </div>
      <button
        type="button"
        class="theme-toggle"
        id="themeToggleBtn"
        aria-label="Ganti tema terang atau gelap"
        title="Ganti tema terang / gelap"
      >🌙</button>
    </div>

    <div class="card">
      <form id="pengirimanForm" class="form-grid" autocomplete="off">
        <input type="hidden" id="editIndex" value="" />
        <input type="hidden" id="editId" value="" />

        <div class="form-group">
          <label for="namaToko">Nama Toko</label>
          <input
            type="text"
            id="namaToko"
            placeholder="Ketik sebagian nama toko..."
            required
          />
          <div class="autocomplete-list" id="tokoSuggestions" role="listbox"></div>
        </div>

        <div class="form-group">
          <label for="tanggalPengiriman">Tanggal Pengiriman</label>
          <input type="date" id="tanggalPengiriman" required />
        </div>

        <div class="form-group">
          <label for="noSuratJalan">No Surat Jalan</label>
          <input type="text" id="noSuratJalan" placeholder="Nomor surat jalan" required />
        </div>

        <div class="form-group">
          <label for="jumlahKoli">Jumlah Koli</label>
          <input type="number" id="jumlahKoli" min="1" step="1" placeholder="0" required />
        </div>

        <div class="form-group">
          <label for="noResi">No Resi</label>
          <input type="text" id="noResi" placeholder="Nomor resi" required />
        </div>

        <div class="form-group form-actions">
          <button type="submit" class="btn-primary" id="submitBtn">+ Simpan</button>
          <button type="button" class="btn-cancel" id="cancelEditBtn" style="display: none;">Batal</button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="meta-row">
        <div id="summaryBar">Menampilkan 0 dari 0 data • Total Koli: 0</div>
        <span class="status-badge" id="syncStatus">Menunggu sinkronisasi...</span>
      </div>

      <div class="toolbar">
        <input
          type="search"
          id="searchInput"
          class="search-box"
          placeholder="Cari nama toko, no surat jalan, atau no resi..."
        />
        <div class="btn-group">
          <button type="button" class="btn-sync" id="refreshBtn">↻ Sinkron</button>
          <button type="button" class="btn-excel" id="exportExcelBtn">Export Excel (.xlsx)</button>
          <button type="button" class="btn-pdf" id="exportPdfBtn">Export PDF</button>
          <button type="button" class="btn-danger" id="clearAllBtn">Reset Semua</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>Nama Toko</th>
              <th>Tanggal Pengiriman</th>
              <th>No Surat Jalan</th>
              <th>Jumlah Koli</th>
              <th>No Resi</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="7" class="empty">Belum ada data pengiriman.</td>
            </tr>
          </tbody>
          <tfoot id="tableFoot" style="display: none;">
            <tr>
              <td colspan="4" style="text-align: right;">Total Koli</td>
              <td id="totalKoliCell">0</td>
              <td colspan="2"></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzMGFCxAuwq7_E2JYeosMkboCxPgjjRB87J-pqsa6FV1ODRiHjF5-KdpdE1o9d5kF0WKw/exec";
    const STORAGE_KEY = "rekap_pengiriman_sheets_v1";
    const TOKO_CACHE_KEY = "ekspedisi_daftar_toko_v1";
    const THEME_KEY = "ekspedisi_tema_v1";

    let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    let daftarToko = JSON.parse(localStorage.getItem(TOKO_CACHE_KEY) || "[]");
    let isBusy = false;
    let activeSuggestionIdx = -1;

    const rootEl = document.documentElement;
    const themeToggleBtn = document.getElementById("themeToggleBtn");
    const metaThemeColor = document.getElementById("metaThemeColor");
    const form = document.getElementById("pengirimanForm");
    const namaTokoInput = document.getElementById("namaToko");
    const tokoSuggestionsEl = document.getElementById("tokoSuggestions");
    const jumlahKoliInput = document.getElementById("jumlahKoli");
    const editIndexInput = document.getElementById("editIndex");
    const editIdInput = document.getElementById("editId");
    const submitBtn = document.getElementById("submitBtn");
    const cancelEditBtn = document.getElementById("cancelEditBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const clearAllBtn = document.getElementById("clearAllBtn");
    const searchInput = document.getElementById("searchInput");
    const tableBody = document.getElementById("tableBody");
    const tableFoot = document.getElementById("tableFoot");
    const totalKoliCell = document.getElementById("totalKoliCell");
    const summaryBar = document.getElementById("summaryBar");
    const syncStatus = document.getElementById("syncStatus");

    jumlahKoliInput.addEventListener("wheel", function (e) {
      e.preventDefault();
    }, { passive: false });

    function getMatchingToko(query) {
      const q = String(query || "").trim().toLowerCase();
      if (!q) return daftarToko.slice(0, 25);
      return daftarToko.filter((nama) => nama.toLowerCase().includes(q)).slice(0, 25);
    }

    function closeTokoSuggestions() {
      activeSuggestionIdx = -1;
      tokoSuggestionsEl.classList.remove("open");
      tokoSuggestionsEl.innerHTML = "";
    }

    function selectToko(nama) {
      namaTokoInput.value = nama;
      closeTokoSuggestions();
    }

    function renderTokoSuggestions() {
      const matches = getMatchingToko(namaTokoInput.value);
      activeSuggestionIdx = -1;

      if (daftarToko.length === 0) {
        tokoSuggestionsEl.innerHTML = `<div class="autocomplete-empty">Belum ada data di sheet "daftar toko". Ketik manual tetap bisa.</div>`;
        tokoSuggestionsEl.classList.add("open");
        return;
      }

      if (matches.length === 0) {
        tokoSuggestionsEl.innerHTML = `<div class="autocomplete-empty">Tidak cocok di daftar toko. Tetap bisa pakai ketikan manual.</div>`;
        tokoSuggestionsEl.classList.add("open");
        return;
      }

      tokoSuggestionsEl.innerHTML = matches
        .map((nama, idx) => `<div class="autocomplete-item" role="option" data-idx="${idx}" data-value="${escapeHtml(nama)}">${escapeHtml(nama)}</div>`)
        .join("");

      tokoSuggestionsEl.querySelectorAll(".autocomplete-item").forEach((el) => {
        el.addEventListener("mousedown", function (e) {
          e.preventDefault();
          selectToko(el.getAttribute("data-value") || "");
        });
      });

      tokoSuggestionsEl.classList.add("open");
    }

    namaTokoInput.addEventListener("input", renderTokoSuggestions);
    namaTokoInput.addEventListener("focus", renderTokoSuggestions);

    namaTokoInput.addEventListener("keydown", function (e) {
      if (!tokoSuggestionsEl.classList.contains("open")) return;
      const items = tokoSuggestionsEl.querySelectorAll(".autocomplete-item");
      if (!items.length) return;

      if (e.key === "ArrowDown") {
        e.preventDefault();
        activeSuggestionIdx = (activeSuggestionIdx + 1) % items.length;
        items.forEach((el, i) => el.classList.toggle("active", i === activeSuggestionIdx));
        items[activeSuggestionIdx].scrollIntoView({ block: "nearest" });
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        activeSuggestionIdx = (activeSuggestionIdx - 1 + items.length) % items.length;
        items.forEach((el, i) => el.classList.toggle("active", i === activeSuggestionIdx));
        items[activeSuggestionIdx].scrollIntoView({ block: "nearest" });
      } else if (e.key === "Enter" && activeSuggestionIdx >= 0) {
        e.preventDefault();
        selectToko(items[activeSuggestionIdx].getAttribute("data-value") || "");
      } else if (e.key === "Escape") {
        closeTokoSuggestions();
      }
    });

    document.addEventListener("click", function (e) {
      if (!e.target.closest("#namaToko") && !e.target.closest("#tokoSuggestions")) {
        closeTokoSuggestions();
      }
    });

    function setSyncStatus(text, type = "") {
      syncStatus.textContent = text;
      syncStatus.className = "status-badge" + (type ? " " + type : "");
    }

    function setBusy(state) {
      isBusy = state;
      submitBtn.disabled = state;
      refreshBtn.disabled = state;
      clearAllBtn.disabled = state;
      document.querySelectorAll(".btn-edit, .btn-del").forEach((btn) => {
        btn.disabled = state;
      });
    }

    function isConfigured() {
      return (
        typeof APPS_SCRIPT_URL === "string" &&
        APPS_SCRIPT_URL.startsWith("https://script.google.com/macros/s/") &&
        APPS_SCRIPT_URL.endsWith("/exec")
      );
    }

    function createId() {
      return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
    }

    function getPreferredTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved === "dark" || saved === "light") return saved;
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
    }

    function applyTheme(theme, save = false) {
      const isDark = theme === "dark";
      if (isDark) {
        rootEl.setAttribute("data-theme", "dark");
        themeToggleBtn.textContent = "☀️";
        themeToggleBtn.title = "Ganti ke mode terang";
        metaThemeColor.setAttribute("content", "#0b1120");
      } else {
        rootEl.removeAttribute("data-theme");
        themeToggleBtn.textContent = "🌙";
        themeToggleBtn.title = "Ganti ke mode gelap";
        metaThemeColor.setAttribute("content", "#0f766e");
      }
      if (save) {
        localStorage.setItem(THEME_KEY, theme);
      }
    }

    applyTheme(getPreferredTheme(), false);

    themeToggleBtn.addEventListener("click", function () {
      const currentIsDark = rootEl.getAttribute("data-theme") === "dark";
      applyTheme(currentIsDark ? "light" : "dark", true);
    });

    document.getElementById("tanggalPengiriman").valueAsDate = new Date();

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      localStorage.setItem(TOKO_CACHE_KEY, JSON.stringify(daftarToko));
    }

    function formatTanggal(iso) {
      if (!iso) return "-";
      const str = String(iso).trim();
      const isoMatch = /^(\d{4})-(\d{2})-(\d{2})/.exec(str);
      if (isoMatch) {
        return `${isoMatch[3]}/${isoMatch[2]}/${isoMatch[1]}`;
      }
      const parsed = new Date(str);
      if (!Number.isNaN(parsed.getTime())) {
        const d = String(parsed.getDate()).padStart(2, "0");
        const m = String(parsed.getMonth() + 1).padStart(2, "0");
        const y = parsed.getFullYear();
        return `${d}/${m}/${y}`;
      }
      return str;
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function getFilteredRecords() {
      const q = searchInput.value.trim().toLowerCase();
      if (!q) {
        return records.map((item, idx) => ({ item, realIndex: idx }));
      }
      return records
        .map((item, idx) => ({ item, realIndex: idx }))
        .filter(({ item }) =>
          [item.namaToko, item.noSuratJalan, item.noResi, item.tanggalPengiriman]
            .some((val) => String(val || "").toLowerCase().includes(q))
        );
    }

    function render() {
      const filtered = getFilteredRecords();

      if (filtered.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="7" class="empty">
              ${records.length === 0 ? "Belum ada data pengiriman." : "Data tidak cocok dengan pencarian."}
            </td>
          </tr>
        `;
        tableFoot.style.display = "none";
        summaryBar.textContent = `Menampilkan 0 dari ${records.length} data • Total Koli: 0`;
        setBusy(isBusy);
        return;
      }

      let totalKoli = 0;
      tableBody.innerHTML = filtered
        .map(({ item, realIndex }, i) => {
          const koli = Number(item.jumlahKoli) || 0;
          totalKoli += koli;
          return `
            <tr>
              <td>${i + 1}</td>
              <td>${escapeHtml(item.namaToko)}</td>
              <td>${formatTanggal(item.tanggalPengiriman)}</td>
              <td>${escapeHtml(item.noSuratJalan)}</td>
              <td>${koli}</td>
              <td>${escapeHtml(item.noResi)}</td>
              <td>
                <button type="button" class="btn-edit" onclick="mulaiEdit(${realIndex})">Edit</button>
                <button type="button" class="btn-del" onclick="hapusData(${realIndex})">Hapus</button>
              </td>
            </tr>
          `;
        })
        .join("");

      totalKoliCell.textContent = totalKoli;
      tableFoot.style.display = "";
      summaryBar.textContent = `Menampilkan ${filtered.length} dari ${records.length} data • Total Koli: ${totalKoli}`;
      setBusy(isBusy);
    }

    function resetFormMode() {
      editIndexInput.value = "";
      editIdInput.value = "";
      submitBtn.textContent = "+ Simpan";
      cancelEditBtn.style.display = "none";
      namaTokoInput.value = "";
      document.getElementById("noSuratJalan").value = "";
      jumlahKoliInput.value = "";
      document.getElementById("noResi").value = "";
      closeTokoSuggestions();
      namaTokoInput.focus();
    }

    async function muatDariSheets() {
      if (!isConfigured()) {
        setSyncStatus("URL harus berakhiran /exec", "err");
        return;
      }
      setBusy(true);
      setSyncStatus("Menyinkronkan...", "");
      try {
        const res = await fetch(`${APPS_SCRIPT_URL}?t=${Date.now()}`);
        const json = await res.json();
        if (!json.ok) {
          throw new Error(json.error || "Gagal memuat data dari Google Sheets");
        }
        records = (Array.isArray(json.data) ? json.data : []).map((row) => ({
          ...row,
          id: row.id || createId(),
          jumlahKoli: Number(row.jumlahKoli) || 0,
        }));
        if (Array.isArray(json.toko)) {
          daftarToko = json.toko;
        }
        persist();
        render();
        setSyncStatus(`Tersinkron (${daftarToko.length} toko)`, "ok");
      } catch (err) {
        console.error(err);
        setSyncStatus("Gagal sinkron (pakai cache lokal)", "err");
      } finally {
        setBusy(false);
      }
    }

    async function kirimKeSheets(payload) {
      if (!isConfigured()) {
        throw new Error("URL Web App harus berakhiran /exec.");
      }
      const res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
      });
      const json = await res.json();
      if (!json.ok) {
        throw new Error(json.error || "Gagal menyimpan ke Google Sheets");
      }
      return json;
    }

    window.mulaiEdit = function (index) {
      const item = records[index];
      if (!item) return;
      editIndexInput.value = String(index);
      editIdInput.value = item.id || "";
      namaTokoInput.value = item.namaToko;
      document.getElementById("tanggalPengiriman").value = item.tanggalPengiriman;
      document.getElementById("noSuratJalan").value = item.noSuratJalan;
      jumlahKoliInput.value = item.jumlahKoli;
      document.getElementById("noResi").value = item.noResi;
      submitBtn.textContent = "Update";
      cancelEditBtn.style.display = "";
      closeTokoSuggestions();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    window.hapusData = async function (index) {
      if (isBusy) return;
      const target = records[index];
      if (!target) return;

      setBusy(true);
      setSyncStatus("Menghapus data...", "");
      try {
        if (isConfigured() && target.id) {
          await kirimKeSheets({ action: "delete", id: target.id });
        }
        records.splice(index, 1);
        if (editIndexInput.value === String(index)) {
          resetFormMode();
        }
        persist();
        render();
        setSyncStatus("Tersinkron ke Google Sheets", "ok");
      } catch (err) {
        alert("Gagal menghapus di Google Sheets: " + err.message);
        setSyncStatus("Gagal sinkron", "err");
      } finally {
        setBusy(false);
      }
    };

    cancelEditBtn.addEventListener("click", resetFormMode);
    searchInput.addEventListener("input", render);
    refreshBtn.addEventListener("click", muatDariSheets);

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      if (isBusy) return;

      const editIdx = editIndexInput.value;
      const existingId = editIdInput.value || createId();

      const entry = {
        id: existingId,
        namaToko: namaTokoInput.value.trim(),
        tanggalPengiriman: document.getElementById("tanggalPengiriman").value,
        noSuratJalan: document.getElementById("noSuratJalan").value.trim(),
        jumlahKoli: parseInt(jumlahKoliInput.value, 10) || 0,
        noResi: document.getElementById("noResi").value.trim(),
      };

      setBusy(true);
      setSyncStatus("Menyimpan ke Sheets...", "");

      try {
        if (editIdx !== "") {
          await kirimKeSheets({ action: "update", item: entry });
          records[Number(editIdx)] = entry;
        } else {
          const resp = await kirimKeSheets({ action: "add", item: entry });
          if (resp && resp.id) entry.id = resp.id;
          records.push(entry);
        }

        persist();
        render();
        resetFormMode();
        setSyncStatus("Tersinkron ke Google Sheets", "ok");
      } catch (err) {
        alert("Gagal menyimpan ke Google Sheets: " + err.message);
        setSyncStatus("Gagal menyimpan", "err");
      } finally {
        setBusy(false);
      }
    });

    clearAllBtn.addEventListener("click", async function () {
      if (isBusy || records.length === 0) return;
      if (!confirm("Hapus semua data rekap pengiriman (termasuk di Google Sheets)?")) return;

      setBusy(true);
      setSyncStatus("Menghapus semua data...", "");
      try {
        if (isConfigured()) {
          await kirimKeSheets({ action: "clear" });
        }
        records = [];
        persist();
        resetFormMode();
        render();
        setSyncStatus("Tersinkron ke Google Sheets", "ok");
      } catch (err) {
        alert("Gagal mereset data di Google Sheets: " + err.message);
        setSyncStatus("Gagal sinkron", "err");
      } finally {
        setBusy(false);
      }
    });

    function cloneStyle(style) {
      return style ? JSON.parse(JSON.stringify(style)) : {};
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // Export memakai template.xlsx supaya bentuk, lebar kolom, border, dan
    // setelan cetak sama persis dengan form rekap pengiriman.
    document.getElementById("exportExcelBtn").addEventListener("click", async function () {
      const filtered = getFilteredRecords();
      if (filtered.length === 0) {
        alert("Tidak ada data untuk di-export.");
        return;
      }

      const btn = this;
      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = "Menyiapkan...";

      try {
        const res = await fetch("template.xlsx", { cache: "no-store" });
        if (!res.ok) {
          throw new Error("template.xlsx tidak bisa dimuat (" + res.status + ")");
        }

        const wb = new ExcelJS.Workbook();
        await wb.xlsx.load(await res.arrayBuffer());

        const ws = wb.getWorksheet("Rekap Pengiriman") || wb.worksheets[0];
        if (!ws) {
          throw new Error("Sheet 'Rekap Pengiriman' tidak ditemukan di template");
        }

        // Gaya baris dari template: baris 2 (tanpa garis atas) dan baris 3
        // (border tipis penuh) dipakai bergantian sesuai posisi data.
        const firstStyles = [];
        const bodyStyles = [];
        for (let c = 1; c <= 6; c++) {
          firstStyles.push(cloneStyle(ws.getRow(2).getCell(c).style));
          bodyStyles.push(cloneStyle(ws.getRow(3).getCell(c).style));
        }

        // Bersihkan isi baris data lama di template.
        for (let r = 2; r <= ws.rowCount; r++) {
          for (let c = 1; c <= 6; c++) {
            ws.getRow(r).getCell(c).value = null;
          }
        }

        filtered.forEach(({ item }, i) => {
          const r = i + 2;
          const row = ws.getRow(r);
          const styles = i === 0 ? firstStyles : bodyStyles;
          for (let c = 1; c <= 6; c++) {
            row.getCell(c).style = cloneStyle(styles[c - 1]);
          }
          row.getCell(1).value = i + 1;
          row.getCell(2).value = String(item.namaToko ?? "");
          row.getCell(3).value = formatTanggal(item.tanggalPengiriman);
          row.getCell(4).value = String(item.noSuratJalan ?? "");
          row.getCell(5).value = Number(item.jumlahKoli) || 0;
          row.getCell(6).value = String(item.noResi ?? "");
          // No surat jalan & no resi selalu teks (jangan jadi notasi ilmiah).
          row.getCell(4).numFmt = "@";
          row.getCell(6).numFmt = "@";
          row.height = 15.75;
        });

        // Batasi area cetak ke baris yang berisi data.
        ws.pageSetup.printArea = `A1:F${filtered.length + 1}`;

        const buf = await wb.xlsx.writeBuffer();
        const today = new Date().toISOString().slice(0, 10);
        downloadBlob(
          new Blob([buf], {
            type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
          }),
          `rekap-pengiriman-${today}.xlsx`
        );
      } catch (err) {
        console.error(err);
        alert("Gagal membuat file Excel: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    });

    document.getElementById("exportPdfBtn").addEventListener("click", function () {
      const filtered = getFilteredRecords();
      if (filtered.length === 0) {
        alert("Tidak ada data untuk di-export.");
        return;
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
      const today = new Date().toISOString().slice(0, 10);

      doc.setFontSize(14);
      doc.setTextColor(15, 23, 42);
      doc.text("REKAP PENGIRIMAN BARANG", 14, 15);

      doc.setFontSize(9.5);
      doc.setTextColor(100, 116, 139);
      doc.text(`Tanggal Export: ${formatTanggal(today)} • Jumlah Baris: ${filtered.length}`, 14, 21);

      let totalKoli = 0;
      const body = filtered.map(({ item }, idx) => {
        const koli = Number(item.jumlahKoli) || 0;
        totalKoli += koli;
        return [
          String(idx + 1),
          String(item.namaToko ?? ""),
          formatTanggal(item.tanggalPengiriman),
          String(item.noSuratJalan ?? ""),
          String(koli),
          String(item.noResi ?? ""),
        ];
      });

      const totalRowIndex = body.length;
      body.push(["", "", "", "Total Koli", String(totalKoli), ""]);

      doc.autoTable({
        startY: 26,
        head: [["No", "Nama Toko", "Tanggal Pengiriman", "No Surat Jalan", "Jumlah Koli", "No Resi"]],
        body,
        styles: {
          fontSize: 9,
          cellPadding: 3,
          textColor: [15, 23, 42],
        },
        headStyles: {
          fillColor: [15, 118, 110],
          textColor: [255, 255, 255],
          fontStyle: "bold",
        },
        columnStyles: {
          0: { halign: "center", cellWidth: 14 },
          1: { cellWidth: "auto" },
          2: { halign: "center", cellWidth: 36 },
          3: { cellWidth: 42 },
          4: { halign: "right", cellWidth: 28 },
          5: { cellWidth: 52 },
        },
        didParseCell: function (data) {
          if (data.section === "body" && data.row.index === totalRowIndex) {
            data.cell.styles.fontStyle = "bold";
            data.cell.styles.fillColor = [241, 245, 249];
          }
        },
      });

      doc.save(`rekap-pengiriman-${today}.pdf`);
    });

    render();
    muatDariSheets();
  </script>
</body>
</html>
